<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg:     #f5f1ea;
        --card:   #ffffff;
        --text:   #1f2937;
        --muted:  #6b7280;
        --accent: #1f8f4f;
        --border: #e5e7eb;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .shell { max-width: 480px; width: 100%; text-align: center; }

      .logo {
        width: 76px; height: 76px;
        border-radius: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
        overflow: hidden;
      }
      .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }

      .tag { color: var(--muted); font-size: 14px; margin-bottom: 36px; margin-top: 4px; }

      .cards { display: flex; flex-direction: column; gap: 12px; }

      a.card {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        text-decoration: none;
        color: var(--text);
        text-align: left;
        transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      }
      a.card:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
        box-shadow: 0 8px 24px rgba(31, 143, 79, 0.10);
      }

      .card-icon {
        width: 44px; height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 20px;
      }

      .card-body { flex: 1; }
      .card-body h2 { font-size: 16px; font-weight: 600; margin-bottom: 3px; }
      .card-body p { font-size: 13px; color: var(--muted); line-height: 1.5; }

      .card-arrow {
        color: var(--accent);
        font-size: 18px;
        flex-shrink: 0;
        transition: transform 0.15s ease;
      }
      a.card:hover .card-arrow { transform: translateX(3px); }

      footer {
        margin-top: 40px;
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 520px) {
        .shell { max-width: 100%; }
        h1 { font-size: 24px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="logo"><img src="/logo.png" alt="" /></div>
      <p class="tag">Sign in to your portal.</p>

      <div class="cards">
        <a class="card" href="/vendor/auth">
          <div class="card-icon" style="background: #FAECE7;">
            <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="#993C1D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 21h18M3 7v1a3 3 0 006 0V7m0 0v1a3 3 0 006 0V7m0 0v1a3 3 0 006 0V7L18 3H6L3 7zM5 21V10.85M19 21V10.85"/>
            </svg>
          </div>
          <div class="card-body">
            <h2>Vendor portal</h2>
            <p>Sign in with the credentials your admin gave you.</p>
          </div>
          <span class="card-arrow">→</span>
        </a>

        <a class="card" href="/client/auth">
          <div class="card-icon" style="background: #EEEDFE;">
            <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="#534AB7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
            </svg>
          </div>
          <div class="card-body">
            <h2>Client portal</h2>
            <p>Sign in with the credentials your admin gave you.</p>
          </div>
          <span class="card-arrow">→</span>
        </a>
      </div>

      <footer>Internal · Confidential</footer>
    </div>
  </body>
</html>
